info:
  name: Signup
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/signup"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "test@example.com",
        "password": "hello123",
        "name": "Kunal"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
